<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Photo & video gallery - NUBS KNUST" />
    <title>Gallery - NUBS KNUST</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Bootstrap Icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">

        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-5">
                <a class="navbar-brand fw-bold" href="index.html">NUBS KNUST</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="wings.html">Wings</a></li>
                        <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact & Join</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container px-5 my-5">

            <div class="glass-section gallery-page-hero rounded-4">
                <span class="section-eyebrow">Moments & memories</span>
                <h1 class="section-heading mb-0">Gallery</h1>
                <p class="section-subtext">Photos and videos from across the fellowship</p>
            </div>

            <div class="filter-chip-group">
                <button class="filter-chip active" data-filter="all">All</button>
                <button class="filter-chip" data-filter="photo">Photos</button>
                <button class="filter-chip" data-filter="video">Videos</button>
            </div>

            <div id="galleryGrid" class="gallery-page-grid">
                <div class="gallery-empty" style="grid-column: 1 / -1;">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Loading
                    gallery&hellip;
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark py-4 mt-auto">
        <div class="container px-5">
            <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                <div class="col-auto">
                    <div class="small m-0 text-white">Copyright &copy; NUBS KNUST 2026</div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Lightbox (shared by photo & video tiles) -->
    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-content" id="lightboxContent">
            <button class="lightbox-btn lightbox-close" id="lightboxClose" aria-label="Close"><i
                    class="bi bi-x-lg"></i></button>
            <button class="lightbox-btn lightbox-prev" id="lightboxPrev" aria-label="Previous"><i
                    class="bi bi-chevron-left"></i></button>
            <button class="lightbox-btn lightbox-next" id="lightboxNext" aria-label="Next"><i
                    class="bi bi-chevron-right"></i></button>
            <div id="lightboxMedia"></div>
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
    </div>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>

    <script>
        let allItems = [];       // combined photos + videos, sorted by date
        let visibleItems = [];   // whatever the current filter shows
        let currentIndex = 0;
        let currentFilter = "all";

        async function loadGallery() {
            const grid = document.getElementById("galleryGrid");

            try {
                const response = await fetch("/api/get-gallery-media");
                if (!response.ok) {
                    const errBody = await response.json().catch(() => ({}));
                    console.error("[gallery] API returned an error:", response.status, errBody);
                    throw new Error("gallery fetch failed");
                }
                const data = await response.json();
                console.log("[gallery] API response:", data);

                const photos = data.photos || [];
                const videos = data.videos || [];

                allItems = [...photos, ...videos].sort((a, b) => {
                    const dateA = a.createdTime ? new Date(a.createdTime).getTime() : 0;
                    const dateB = b.createdTime ? new Date(b.createdTime).getTime() : 0;
                    return dateB - dateA;
                });

                if (allItems.length === 0) {
                    grid.innerHTML = `<div class="gallery-empty" style="grid-column: 1 / -1;">Nothing here yet &mdash; check back soon.</div>`;
                    return;
                }

                applyFilter("all");
            } catch (err) {
                console.error("Error loading gallery:", err);
                grid.innerHTML = `<div class="gallery-empty" style="grid-column: 1 / -1;">Unable to load the gallery right now.</div>`;
            }
        }

        function applyFilter(filter) {
            currentFilter = filter;
            visibleItems = filter === "all" ? allItems : allItems.filter((item) => item.mediaType === filter);
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById("galleryGrid");

            if (visibleItems.length === 0) {
                grid.innerHTML = `<div class="gallery-empty" style="grid-column: 1 / -1;">Nothing to show here yet.</div>`;
                return;
            }

            grid.innerHTML = visibleItems.map((item, i) => {
                if (item.mediaType === "photo") {
                    return `
                        <div class="gallery-page-tile" onclick="openLightbox(${i})">
                            <img src="${item.src}" alt="${item.alt || ''}" loading="lazy" width="400" height="400" />
                        </div>
                    `;
                }
                return `
                    <div class="gallery-page-tile is-video" onclick="openLightbox(${i})">
                        <img src="${item.thumbnail}" alt="${item.title || ''}" loading="lazy" width="400" height="400" />
                        <div class="video-thumb-platform"><i class="bi bi-cloud-fill"></i></div>
                        <div class="video-thumb-play"><span><i class="bi bi-play-fill"></i></span></div>
                    </div>
                `;
            }).join("");
        }

        document.querySelectorAll(".filter-chip").forEach((btn) => {
            btn.addEventListener("click", function () {
                document.querySelectorAll(".filter-chip").forEach((b) => b.classList.remove("active"));
                this.classList.add("active");
                applyFilter(this.dataset.filter);
            });
        });

        // --- Lightbox ---
        function openLightbox(index) {
            currentIndex = index;
            showLightboxItem();
            document.getElementById("lightbox").classList.add("active");
        }

        function showLightboxItem() {
            const media = document.getElementById("lightboxMedia");
            const caption = document.getElementById("lightboxCaption");
            const content = document.getElementById("lightboxContent");
            const item = visibleItems[currentIndex];

            content.classList.remove("is-vertical");

            if (item.mediaType === "photo") {
                media.innerHTML = `<img src="${item.src}" alt="${item.alt || ''}" />`;
                caption.textContent = item.alt || "";
            } else {
                media.innerHTML = `<iframe src="${item.embedUrl}" title="${item.title || ''}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                caption.textContent = item.title || "";
                if (item.vertical) content.classList.add("is-vertical");
            }

            const multi = visibleItems.length > 1;
            document.getElementById("lightboxPrev").style.display = multi ? "flex" : "none";
            document.getElementById("lightboxNext").style.display = multi ? "flex" : "none";
        }

        function closeLightbox() {
            document.getElementById("lightbox").classList.remove("active");
            document.getElementById("lightboxMedia").innerHTML = "";
        }

        document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
        document.getElementById("lightbox").addEventListener("click", function (e) {
            if (e.target === this) closeLightbox();
        });
        document.getElementById("lightboxPrev").addEventListener("click", function () {
            currentIndex = (currentIndex - 1 + visibleItems.length) % visibleItems.length;
            showLightboxItem();
        });
        document.getElementById("lightboxNext").addEventListener("click", function () {
            currentIndex = (currentIndex + 1) % visibleItems.length;
            showLightboxItem();
        });
        document.addEventListener("keydown", function (e) {
            if (!document.getElementById("lightbox").classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") document.getElementById("lightboxPrev").click();
            if (e.key === "ArrowRight") document.getElementById("lightboxNext").click();
        });

        document.addEventListener("DOMContentLoaded", loadGallery);
    </script>
</body>

</html>
