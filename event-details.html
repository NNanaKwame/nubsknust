<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details | NUBS KNUST</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/nubsknustlogo.png" />
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <!-- Vercel Speed Insights -->
  <script type="module" src="/js/speed-insights.js"></script>
  <style>
    .details-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 1rem;
      text-decoration: none;
      color: #374151;
      font-weight: 600;
    }

    .details-banner {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }

    .details-meta {
      display: flex;
      gap: 2rem;
      color: #4b5563;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
  </style>
    <script src="/js/html-safety.js"></script>
    <link rel="stylesheet" href="/css/site-footer.css" />
</head>

<body>

  <main class="details-container">
    <a href="/events.html" class="back-btn">&larr; Back to Events</a>
    <div id="event-detail-content">Loading event details...</div>
  </main>
    <footer class="site-footer">
        <div class="site-footer-inner">
            <p>&copy; 2026 NUBS KNUST. All Rights Reserved.</p>
            <nav aria-label="Footer navigation">
                <a href="/about.html">About</a><span aria-hidden="true">&middot;</span>
                <a href="/contact.html">Contact</a><span aria-hidden="true">&middot;</span>
                <a href="/privacy.html">Privacy Policy</a><span aria-hidden="true">&middot;</span>
                <a href="/terms.html">Terms of Use</a><span aria-hidden="true">&middot;</span>
                <a href="/cookies.html">Cookie Policy</a>
            </nav>
        </div>
    </footer>

  <script>
    async function fetchEventDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('id');
      const container = document.getElementById('event-detail-content');

      if (!eventId) {
        container.innerHTML = '<p>Event not found.</p>';
        return;
      }

      try {
        // Fetch all events to locate current selected event
        const response = await fetch('/api/get-events?type=events');
        const data = await response.json();
        const event = data.items.find(item => item.id === eventId);

        if (!event) {
          container.innerHTML = '<p>Event details not available.</p>';
          return;
        }

        container.innerHTML = `
          <img src="/api/image-proxy?id=${encodeURIComponent(event.id)}" alt="${escapeHTML(event.title)}" class="details-banner" />
          <h1>${escapeHTML(event.title)}</h1>
          <div class="details-meta">
            <span>📅 ${escapeHTML(event.date)}</span>
            <span>📍 ${escapeHTML(event.location || 'KNUST Campus')}</span>
          </div>
          <hr />
          <p style="font-size: 1.1rem; line-height: 1.6; color: #374151; margin-top: 1.5rem;">
            ${escapeHTML(event.description)}
          </p>
        `;
      } catch (err) {
        console.error("Error loading event details:", err);
        container.innerHTML = '<p>Failed to load event details.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', fetchEventDetails);
  </script>
</body>

</html>
