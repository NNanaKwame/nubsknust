<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Digital Library - NUBS KNUST" />
    <title>Digital Library - NUBS KNUST</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/nubsknustlogo.png" />
    <!-- Bootstrap Icons-->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" as="style"
        onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    </noscript>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/library.css" rel="stylesheet" />
    <link href="/css/book-covers.css" rel="stylesheet" />
    <!-- Vercel Speed Insights -->
    <script type="module" src="/js/speed-insights.js"></script>
</head>

<body class="d-flex flex-column h-100 bg-light">
    <main class="flex-shrink-0">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container px-5">
                <a class="navbar-brand fw-bold" href="index.html">NUBS KNUST</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="library.html">Library</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container px-5 my-5">

            <div class="glass-section gallery-page-hero rounded-4">
                <span class="section-eyebrow">Resource hub</span>
                <h1 class="section-heading mb-0">The NUBS Digital Library</h1>
                <p class="section-subtext">Access foundational Christian literature, devotionals, and leadership guides for free</p>
            </div>

            <div class="library-toolbar">
            <div class="library-search" role="search" aria-label="Search the library">
                <button type="button" id="librarySearchToggle" class="library-search-button" aria-label="Search books" aria-expanded="false" aria-controls="librarySearchField" title="Search books">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
                </button>
                <div id="librarySearchField" class="library-search-field" hidden>
                    <input type="search" id="librarySearch" placeholder="Title or author…" aria-label="Search by title or author" aria-describedby="libraryResults" />
                    <button type="button" id="librarySearchClose" class="library-search-button" aria-label="Clear and close search" title="Close search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                    </button>
                </div>
            </div>

            <div class="filter-chip-group" id="libraryFilters">
                <button class="filter-chip active" data-filter="all">All Books</button>
                <button class="filter-chip" data-filter="devotional">Devotional</button>
                <button class="filter-chip" data-filter="doctrine">Doctrine</button>
                <button class="filter-chip" data-filter="leadership">Leadership</button>
                <button class="filter-chip" data-filter="discipleship">Discipleship</button>
            </div>

            </div>

            <p id="libraryResults" class="text-muted small" role="status" aria-live="polite" aria-atomic="true">Loading books…</p>

            <div id="libraryGrid" class="book-grid">
                <div class="gallery-empty" style="grid-column: 1 / -1;">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Loading library&hellip;
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark py-4 mt-auto">
        <div class="container px-5">
            <div class="row align-items-center justify-content-between flex-column flex-sm-row">
                <div class="col-auto">
                    <div class="small m-0 text-white">&copy; NUBS KNUST. All Rights Reserved.</div>
                </div>
                <div class="col-auto">
                    <a class="link-light small" href="about.html">About</a>
                    <span class="text-white mx-1">&middot;</span>
                    <a class="link-light small" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
    <!-- Library JS -->
    <script src="/js/book-catalogue.js"></script>
    <script src="js/library.js"></script>
</body>

</html>
