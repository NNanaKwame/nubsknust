<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="Upcoming and past events of NUBS KNUST" />
  <title>Events & Programs - NUBS KNUST</title>

  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Bootstrap Icons-->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" as="style"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  </noscript>
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <!-- Vercel Speed Insights -->
  <script type="module" src="/js/speed-insights.js"></script>
</head>

<body class="d-flex flex-column h-100">
  <main class="flex-shrink-0">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container px-5">
        <a class="navbar-brand fw-bold" href="index.html">NUBS KNUST</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="wings.html">Wings</a></li>
            <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact </a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Header -->
    <div class="container px-5 my-5">
      <div class="glass-section gallery-page-hero rounded-4">
        <span class="section-eyebrow">Stay in the loop</span>
        <h1 class="section-heading mb-0">Events & Programs</h1>
        <p class="section-subtext">Stay updated with all upcoming fellowship gatherings, services, and special events
        </p>
      </div>

      <div class="filter-chip-group" id="event-filters">
        <button class="filter-chip active" data-filter="all">All Events</button>
        <button class="filter-chip" data-filter="today">Today</button>
        <button class="filter-chip" data-filter="tomorrow">Tomorrow</button>
        <button class="filter-chip" data-filter="upcoming">Upcoming</button>
        <button class="filter-chip" data-filter="past">Past</button>
      </div>
    </div>

    <!-- Main Events Grid Section -->
    <section class="pb-5">
      <div class="container px-5">

        <!-- Main Container for Cards -->
        <div id="full-events-container" class="events-grid"></div>

        <!-- Infinite Scroll Trigger Element -->
        <div id="events-observer-target" style="text-align: center; padding: 2rem 0; display: none;">
          <div class="spinner-border text-primary" role="status" style="width: 2rem; height: 2rem;">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-dark py-4 mt-auto">
    <div class="container px-5">
      <div class="row align-items-center justify-content-between flex-column flex-sm-row">
        <div class="col-auto">
          <div class="small m-0 text-white">Copyright &copy; NUBS KNUST 2026</div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core theme JS -->
  <script src="/js/date-utils.js"></script>
  <script src="/js/scripts.js"></script>
</body>

</html>
